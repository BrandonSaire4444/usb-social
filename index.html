<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Notas — Docentes y Estudiantes</title>

<!--
  =========================================================================
  SISTEMA DE NOTAS CON ROLES (DOCENTE / ESTUDIANTE) — SUPABASE AUTH
  =========================================================================
  - Login/registro con correo y contraseña (Supabase Auth).
  - Cada usuario tiene un perfil en la tabla "profiles" con un rol:
    'docente' o 'estudiante' (por defecto, todo el que se registra es
    'estudiante'; el profesor se asciende manualmente con una consulta SQL).
  - Los DOCENTES pueden agregar y eliminar notas.
  - Los ESTUDIANTES solo pueden ver las notas, agrupadas por materia.
  - La seguridad real (quién puede insertar/eliminar) vive en las políticas
    RLS de Supabase, NO solo en este JavaScript: aunque alguien manipule el
    código del navegador, la base de datos rechazará operaciones no
    permitidas para su rol.
  =========================================================================
-->

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
  .toast { transition: opacity 0.3s ease, transform 0.3s ease; }
</style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">

<!-- ===================== PANTALLA DE LOGIN / REGISTRO ===================== -->
<div id="pantalla-auth" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow p-6 sm:p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-center text-indigo-700 mb-1">📚 Registro de Notas</h1>
    <p id="auth-subtitulo" class="text-center text-xs text-slate-400 mb-6">Inicia sesión para continuar</p>

    <form id="form-auth" class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Correo</label>
        <input id="auth-correo" type="email" required placeholder="tucorreo@ejemplo.com"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Contraseña</label>
        <input id="auth-clave" type="password" required minlength="6" placeholder="Mínimo 6 caracteres"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit" id="btn-auth-submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition text-white font-medium px-4 py-2.5 rounded-lg text-sm shadow">
        Iniciar sesión
      </button>
    </form>

    <button id="btn-alternar-modo" class="mt-4 text-xs text-indigo-600 hover:underline w-full text-center">
      ¿No tienes cuenta? Regístrate aquí
    </button>

    <p id="auth-error" class="mt-3 text-xs text-red-500 text-center hidden"></p>
  </div>
</div>

<!-- ===================== APP PRINCIPAL (solo visible logueado) ===================== -->
<div id="pantalla-app" class="hidden">

  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-2">
      <div>
        <h1 class="text-lg sm:text-2xl font-bold leading-tight">📚 Registro de Notas</h1>
        <p class="text-indigo-200 text-xs sm:text-sm">Base de datos online con Supabase</p>
      </div>
      <div class="flex items-center gap-3 text-xs sm:text-sm">
        <span id="usuario-info" class="bg-indigo-800/60 px-3 py-1 rounded-full whitespace-nowrap"></span>
        <button id="btn-logout" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-full font-medium">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-6">

    <!-- ===================== FORMULARIO (SOLO DOCENTES) ===================== -->
    <section id="seccion-form-docente" class="bg-white rounded-2xl shadow p-4 sm:p-6 hidden">
      <h2 class="text-base sm:text-lg font-semibold mb-4 text-slate-700">➕ Agregar nota</h2>

      <form id="form-nota" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div class="sm:col-span-2">
          <label class="block text-xs font-medium text-slate-500 mb-1">Estudiante</label>
          <input id="input-estudiante" type="text" required placeholder="Ej: Ana Gómez"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Materia</label>
          <input id="input-materia" type="text" required placeholder="Ej: Bases de Datos" list="lista-materias"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <datalist id="lista-materias"></datalist>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Nota</label>
          <input id="input-nota" type="number" min="0" max="100" required placeholder="0-100"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="sm:col-span-4 flex justify-end">
          <button type="submit" id="btn-guardar-nota"
            class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition text-white font-medium px-5 py-2.5 rounded-lg text-sm shadow disabled:opacity-50">
            Guardar nota
          </button>
        </div>
      </form>
    </section>

    <!-- ===================== AVISO PARA ESTUDIANTES ===================== -->
    <div id="aviso-solo-lectura" class="hidden bg-amber-50 border border-amber-200 text-amber-700 text-sm rounded-xl px-4 py-3">
      👀 Estás en modo de solo lectura. Puedes ver todas las notas, pero solo un docente puede agregarlas o eliminarlas.
    </div>

    <!-- ===================== NOTAS AGRUPADAS POR MATERIA ===================== -->
    <section class="bg-white rounded-2xl shadow p-4 sm:p-6">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <h2 class="text-base sm:text-lg font-semibold text-slate-700">📋 Notas por materia</h2>
        <span id="contador" class="text-xs text-slate-400">0 registros</span>
      </div>

      <!-- Aquí se insertan dinámicamente un bloque <div> + <table> por cada materia -->
      <div id="contenedor-materias" class="space-y-6"></div>
    </section>

  </main>
</div>

<!-- Notificación flotante (toast) -->
<div id="toast" class="toast fixed bottom-4 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none
     bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-lg z-50"></div>

<script>
/* ===========================================================================
   CONFIGURACIÓN DE SUPABASE
   Usa el MISMO proyecto que ya tenías para el registro de estudiantes.
   ===========================================================================
*/
const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';       // <-- reemplaza esto
const SUPABASE_ANON_KEY = 'TU-CLAVE-ANON-PUBLICA-AQUI';        // <-- reemplaza esto

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// -----------------------------------------------------------------------
// Referencias al DOM
// -----------------------------------------------------------------------
const pantallaAuth   = document.getElementById('pantalla-auth');
const pantallaApp    = document.getElementById('pantalla-app');
const formAuth       = document.getElementById('form-auth');
const authCorreoEl   = document.getElementById('auth-correo');
const authClaveEl    = document.getElementById('auth-clave');
const authErrorEl    = document.getElementById('auth-error');
const authSubtituloEl= document.getElementById('auth-subtitulo');
const btnAuthSubmit  = document.getElementById('btn-auth-submit');
const btnAlternarModo= document.getElementById('btn-alternar-modo');

const usuarioInfoEl   = document.getElementById('usuario-info');
const btnLogout       = document.getElementById('btn-logout');
const seccionFormDoc  = document.getElementById('seccion-form-docente');
const avisoSoloLectura= document.getElementById('aviso-solo-lectura');
const formNota        = document.getElementById('form-nota');
const btnGuardarNota  = document.getElementById('btn-guardar-nota');
const listaMateriasEl = document.getElementById('lista-materias');
const contenedorMaterias = document.getElementById('contenedor-materias');
const contadorEl      = document.getElementById('contador');
const toastEl         = document.getElementById('toast');

// Estado local
let modoRegistro = false;  // false = login, true = registro
let miRol = 'estudiante';  // rol del usuario actualmente logueado

// -----------------------------------------------------------------------
// Utilidades
// -----------------------------------------------------------------------
function mostrarToast(mensaje) {
  toastEl.textContent = mensaje;
  toastEl.style.opacity = '1';
  toastEl.style.transform = 'translate(-50%, -8px)';
  clearTimeout(mostrarToast._t);
  mostrarToast._t = setTimeout(() => {
    toastEl.style.opacity = '0';
    toastEl.style.transform = 'translate(-50%, 0)';
  }, 1800);
}

function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function colorNota(nota) {
  if (nota >= 51) return 'bg-emerald-100 text-emerald-700';
  if (nota >= 30) return 'bg-amber-100 text-amber-700';
  return 'bg-red-100 text-red-700';
}

/* -------------------------------------------------------------------
   1. ALTERNAR ENTRE LOGIN Y REGISTRO (misma pantalla, mismo formulario)
   ------------------------------------------------------------------- */
btnAlternarModo.addEventListener('click', () => {
  modoRegistro = !modoRegistro;
  if (modoRegistro) {
    authSubtituloEl.textContent = 'Crea tu cuenta (quedarás como estudiante)';
    btnAuthSubmit.textContent = 'Registrarme';
    btnAlternarModo.textContent = '¿Ya tienes cuenta? Inicia sesión';
  } else {
    authSubtituloEl.textContent = 'Inicia sesión para continuar';
    btnAuthSubmit.textContent = 'Iniciar sesión';
    btnAlternarModo.textContent = '¿No tienes cuenta? Regístrate aquí';
  }
  authErrorEl.classList.add('hidden');
});

/* -------------------------------------------------------------------
   2. LOGIN / REGISTRO (Supabase Auth)
   ------------------------------------------------------------------- */
formAuth.addEventListener('submit', async (e) => {
  e.preventDefault();
  authErrorEl.classList.add('hidden');

  const correo = authCorreoEl.value.trim();
  const clave  = authClaveEl.value;

  btnAuthSubmit.disabled = true;
  btnAuthSubmit.textContent = modoRegistro ? 'Registrando…' : 'Entrando…';

  const { error } = modoRegistro
    ? await supabaseClient.auth.signUp({ email: correo, password: clave })
    : await supabaseClient.auth.signInWithPassword({ email: correo, password: clave });

  btnAuthSubmit.disabled = false;
  btnAuthSubmit.textContent = modoRegistro ? 'Registrarme' : 'Iniciar sesión';

  if (error) {
    authErrorEl.textContent = error.message;
    authErrorEl.classList.remove('hidden');
    return;
  }

  // onAuthStateChange (más abajo) se encarga de mostrar la app
});

/* -------------------------------------------------------------------
   3. LOGOUT
   ------------------------------------------------------------------- */
btnLogout.addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});

/* -------------------------------------------------------------------
   4. REACCIONAR A CAMBIOS DE SESIÓN (login, logout, token expirado)
   Este es el punto central: cada vez que hay sesión activa, cargamos
   el perfil (rol) del usuario y mostramos la app; si no hay sesión,
   mostramos la pantalla de login/registro.
   ------------------------------------------------------------------- */
supabaseClient.auth.onAuthStateChange(async (_evento, sesion) => {
  if (sesion) {
    await cargarPerfilYMostrarApp(sesion);
  } else {
    pantallaApp.classList.add('hidden');
    pantallaAuth.classList.remove('hidden');
    formAuth.reset();
  }
});

async function cargarPerfilYMostrarApp(sesion) {
  // Leemos el perfil del usuario (creado automáticamente por el trigger
  // de Supabase al registrarse) para saber su rol.
  const { data: perfil, error } = await supabaseClient
    .from('profiles')
    .select('rol, email')
    .eq('id', sesion.user.id)
    .single();

  if (error) {
    console.error(error);
    mostrarToast('No se pudo cargar tu perfil.');
    return;
  }

  miRol = perfil.rol;

  usuarioInfoEl.textContent = `${perfil.email} · ${miRol === 'docente' ? '👨‍🏫 Docente' : '🎓 Estudiante'}`;

  // Mostramos u ocultamos el formulario de agregar notas según el rol.
  // (Esto es solo para la INTERFAZ; la seguridad real la impone Supabase
  // con las políticas RLS, así que aunque alguien fuerce mostrar el
  // formulario desde la consola del navegador, el INSERT sería rechazado
  // si su rol no es 'docente'.)
  if (miRol === 'docente') {
    seccionFormDoc.classList.remove('hidden');
    avisoSoloLectura.classList.add('hidden');
  } else {
    seccionFormDoc.classList.add('hidden');
    avisoSoloLectura.classList.remove('hidden');
  }

  pantallaAuth.classList.add('hidden');
  pantallaApp.classList.remove('hidden');

  await refrescarNotas();
}

/* -------------------------------------------------------------------
   5. CARGAR Y AGRUPAR NOTAS POR MATERIA
   ------------------------------------------------------------------- */
async function refrescarNotas() {
  const { data, error } = await supabaseClient
    .from('notas')
    .select('id, estudiante, materia, nota')
    .order('materia', { ascending: true })
    .order('estudiante', { ascending: true });

  if (error) {
    console.error(error);
    mostrarToast('Error al cargar las notas.');
    return;
  }

  contadorEl.textContent = `${data.length} registro${data.length === 1 ? '' : 's'}`;
  contenedorMaterias.innerHTML = '';

  if (data.length === 0) {
    contenedorMaterias.innerHTML = `
      <p class="text-center text-slate-400 py-6">Aún no hay notas registradas.</p>`;
    return;
  }

  // Agrupamos el arreglo plano de notas en un objeto { materia: [notas...] }
  const porMateria = {};
  for (const fila of data) {
    if (!porMateria[fila.materia]) porMateria[fila.materia] = [];
    porMateria[fila.materia].push(fila);
  }

  // Llenamos el <datalist> para autocompletar materias existentes en el form
  listaMateriasEl.innerHTML = Object.keys(porMateria)
    .map(m => `<option value="${escapeHtml(m)}"></option>`).join('');

  // Por cada materia, construimos un bloque con su propia tabla
  for (const materia of Object.keys(porMateria).sort()) {
    const filas = porMateria[materia];

    const bloque = document.createElement('div');
    bloque.className = 'border border-slate-200 rounded-xl overflow-hidden';

    const filasHtml = filas.map(({ id, estudiante, nota }) => `
      <tr class="hover:bg-slate-50">
        <td class="px-3 py-2 font-medium">${escapeHtml(estudiante)}</td>
        <td class="px-3 py-2">
          <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${colorNota(nota)}">${nota}</span>
        </td>
        <td class="px-3 py-2 text-right">
          ${miRol === 'docente'
            ? `<button data-id="${id}" class="btn-borrar text-red-500 hover:text-red-700 text-xs font-medium">Eliminar</button>`
            : ''}
        </td>
      </tr>`).join('');

    bloque.innerHTML = `
      <div class="bg-indigo-50 px-4 py-2 font-semibold text-indigo-700 text-sm">${escapeHtml(materia)}</div>
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
          <tr>
            <th class="px-3 py-2">Estudiante</th>
            <th class="px-3 py-2">Nota</th>
            <th class="px-3 py-2 text-right">${miRol === 'docente' ? 'Acciones' : ''}</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">${filasHtml}</tbody>
      </table>`;

    contenedorMaterias.appendChild(bloque);
  }

  // Enlazamos los botones "Eliminar" (solo existen si miRol === 'docente')
  document.querySelectorAll('.btn-borrar').forEach(btn => {
    btn.addEventListener('click', () => eliminarNota(Number(btn.dataset.id)));
  });
}

/* -------------------------------------------------------------------
   6. AGREGAR NOTA (solo docentes — la UI ya lo restringe, y RLS también)
   ------------------------------------------------------------------- */
formNota.addEventListener('submit', async (e) => {
  e.preventDefault();

  const estudiante = document.getElementById('input-estudiante').value.trim();
  const materia     = document.getElementById('input-materia').value.trim();
  const nota        = Number(document.getElementById('input-nota').value);

  if (!estudiante || !materia || Number.isNaN(nota)) {
    mostrarToast('Completa todos los campos correctamente.');
    return;
  }

  btnGuardarNota.disabled = true;
  btnGuardarNota.textContent = 'Guardando…';

  const { error } = await supabaseClient
    .from('notas')
    .insert([{ estudiante, materia, nota }]);

  btnGuardarNota.disabled = false;
  btnGuardarNota.textContent = 'Guardar nota';

  if (error) {
    console.error(error);
    mostrarToast('No se pudo guardar (¿tu cuenta tiene rol docente?).');
    return;
  }

  formNota.reset();
  document.getElementById('input-estudiante').focus();
  await refrescarNotas();
  mostrarToast('Nota guardada ✔');
});

/* -------------------------------------------------------------------
   7. ELIMINAR NOTA (solo docentes)
   ------------------------------------------------------------------- */
async function eliminarNota(id) {
  const { error } = await supabaseClient
    .from('notas')
    .delete()
    .eq('id', id);

  if (error) {
    console.error(error);
    mostrarToast('No se pudo eliminar el registro.');
    return;
  }

  await refrescarNotas();
  mostrarToast('Registro eliminado');
}

/* -------------------------------------------------------------------
   8. VERIFICACIÓN DE CREDENCIALES AL ARRANCAR
   ------------------------------------------------------------------- */
if (SUPABASE_URL.includes('TU-PROYECTO') || SUPABASE_ANON_KEY.includes('TU-CLAVE')) {
  authErrorEl.textContent = 'Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY en el código.';
  authErrorEl.classList.remove('hidden');
}
</script>
</body>
</html>
